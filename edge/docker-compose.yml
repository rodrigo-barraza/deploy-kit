# Edge proxy (Caddy) — NOT part of the regular deploy fleet until
# edge.config.json enabled:true and deploy-edge.sh ships it.
#
# HOST networking: Caddy listens on the NAS's 18080/18443 itself (the
# Caddyfile's http_port/https_port, from edge.config.json) and the router
# forwards public 80→18080, 443→18443. Published bridge ports hid every
# visitor behind the Docker gateway address, so X-Forwarded-For carried
# 172.16.50.1 for all internet traffic. Secrets (DNS provider API keys)
# come from .env in this directory on the NAS — see README.

services:
  edge-caddy:
    image: edge-caddy:latest
    container_name: edge-caddy
    # `always`, not `unless-stopped`: Container Manager stops every container
    # explicitly when its package stops, and unless-stopped then stays down
    # (see pin_restart_policy in lib.sh).
    restart: always
    # Listens on 18080, 18443 (+ UDP for HTTP/3) and the admin API on
    # localhost:2019 — all set in the generated Caddyfile.
    network_mode: host
    environment:
      - PORKBUN_API_KEY=${PORKBUN_API_KEY:-}
      - PORKBUN_API_SECRET_KEY=${PORKBUN_API_SECRET_KEY:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data # certs — MUST persist across restarts
      - ./caddy-config:/config
